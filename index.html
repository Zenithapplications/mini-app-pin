.conteudo{
  position:relative;z-index:1;
  height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;
}
#titulo{font-size:15px;color:rgba(255,255,255,0.85);letter-spacing:3px;text-transform:uppercase;margin-bottom:6px;text-shadow:0 2px 4px rgba(0,0,0,0.8)}
#d{font-size:34px;letter-spacing:10px;margin:18px 0 10px;min-height:44px;color:#00ffcc;text-shadow:0 0 12px rgba(0,255,200,0.5)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px;max-width:340px;margin:0 auto;width:88%}
button{
  font-size:24px;padding:18px;border:0;border-radius:14px;color:#fff;
  background:rgba(20,20,30,0.65);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.18);
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background 0.12s, transform 0.1s;
}
button:active{background:rgba(255,255,255,0.3);transform:scale(0.96)}
button.confirmar{background:rgba(0,255,200,0.25);border-color:rgba(0,255,200,0.45);color:#00ffcc}
button.confirmar:active{background:rgba(0,255,200,0.5)}
</style>
</head>
<body>
<div class="fundo-blur"></div>
<div class="conteudo">
  <div id="titulo">Digite o PIN</div>
  <div id="d">&nbsp;</div>
  <div class="g" id="g"></div>
</div>
<script>
const tg = Telegram.WebApp;
tg.ready();
tg.expand();
tg.setBackgroundColor("#000");
tg.setHeaderColor("#000");

let pin = "";
const d = document.getElementById("d");
const g = document.getElementById("g");

const up = () => {
  d.textContent = "•".repeat(pin.length) || " ";
};

const teclas = [
  "1", "2", "3",
  "4", "5", "6",
  "7", "8", "9",
  "⌫", "0", "✓"
];

teclas.forEach(t => {
  const btn = document.createElement("button");
  btn.textContent = t;
  if (t === "✓") btn.className = "confirmar";
  btn.onclick = () => {
    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    if (t === "⌫") {
      pin = pin.slice(0, -1);
      up();
    } else if (t === "✓") {
      if (pin.length > 0) {
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        tg.sendData(JSON.stringify({ pin: pin }));
        tg.close();
      }
    } else {
      if (pin.length < 12) {
        pin += t;
        up();
      }
    }
  };
  g.appendChild(btn);
});
</script>
</body>
</html>
